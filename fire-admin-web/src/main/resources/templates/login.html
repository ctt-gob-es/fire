<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>

<link type="text/css" rel="stylesheet"	th:href="@{css/bootstrap.min.css}" />
<link type="text/css" rel="stylesheet" th:href="@{css/main.css}" />
<link type="text/css" rel="stylesheet" th:href="@{css/util.css}" />
<link type="text/css" rel="stylesheet"	th:href="@{css/material-design-iconic-font.min.css}" />
<link type="text/css" rel="stylesheet"	th:href="@{css/font-awesome.min.css}" />

<link type="image/png" rel="icon" th:href="@{images/Logo_FIRe_03.jpg}">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title th:text="#{fire-admin-web.title}"></title></head>
<body>
	<!-- Contenido -->
		
	<div class="container-login">
		<div class="wrap-login">
			<form id="formLogin" class="login-form validate-form" th:action="@{/}" method="post">
					
				<input type='hidden' id="signatureBase64" name="signatureBase64">
					
				<span class="login-form-title p-b-48">
				 <img class="fire-admin-front-img" th:src="@{images/Logo_FIRe_02.jpg}"
					alt="FIRe" />
				</span>

				<!-- <div class="alert alert-danger" th:if="${param.error}"
				 th:text="#{fire-admin-web.login.error}"></div> -->
				<div class="alert alert-danger" id="errorMessage" th:if="${errorMessage}" th:text="${errorMessage}"></div>
				<div class="alert alert-warning" th:if="${param.logout}"
				 th:text="#{fire-admin-web.login.warn.logout}"></div>
				 <div class="alert alert-danger" th:if="${restoreerror}"
				 th:text="${restoreErrorMessage}"></div>
				 
				<div id ="fieldsLoginUsername">
					<div class="container-login-form-btn">
						<div class="wrap-login-form-btn">
							<div class="login-form-bgbtn"></div>
							<button
							onclick="redirectClave();"
							class="login-form-btn"
							th:text="#{fire-admin-web.login.acceso.clave.button}"></button>
						</div>
					</div>
					
					<div class="container-login-form-btn" th:if="${accessByCertificate}">
						<div class="wrap-login-form-btn">
							<div class="login-form-bgbtn"></div>
							<button onclick="authenticateCertificate();return false;" class="login-form-btn" th:text="#{fire-admin-web.login.acceso.certificado.button}"></button>
						</div>
					</div>
				</div>
			</form>
		</div>		
	</div>
	<script th:src="@{js/jquery/jquery-3.5.1.min.js}"></script>
	<script th:src="@{js/jquery/jquery.serializejson.js}"></script>
	<script th:src="@{js/main.js}"></script>
	<script th:src="@{js/miniapplet/functions.js}"></script>
	<script th:src="@{js/miniapplet/autoscript.js}"></script>
	<script th:inline="javascript">
	
		function redirectClave() {
			var loginClave = /*[[@{/loginClave}]]*/;
		    document.getElementById("formLogin").action = loginClave;
            document.getElementById("formLogin").submit();
		}
		
		function authenticateCertificate() {
			cargaAppAfirma();
			var filter = 'filters.1=nonexpired:;issuer.rfc2254:(O=DIRECCION GENERAL DE LA POLICIA)\nfilters.2=nonexpired:;issuer.rfc2254:(|(CN=AC FNMT Usuarios)(O=FNMT-RCM))\nfilters.3=nonexpired:;issuer.rfc2254:(|(CN=AC Sector Público)(O=FNMT-RCM))';
			var randomString = [[${randomStringLogin}]];

			if (!randomString) {
				$('#errorMessage').text('El token de inicio de sesión ha caducado. Refresque la página para intentar acceder');
				return;
			}
			
			authenticate(randomString, filter, autenticar, showError);
		}
		
		function autenticar(signatureBase64) {
			// asignamos el valor de la firma al campo oculto y lo enviamos al back
			$('#signatureBase64').val(signatureBase64);
			var loginWithCertificate = /*[[@{/loginWithCertificate}]]*/;
		    document.getElementById("formLogin").action = loginWithCertificate;
            document.getElementById("formLogin").submit();
		}
		
		function showError (errorType, errorMessage) {
			if (errorType=='es.gob.afirma.core.AOCancelledOperationException'){
				// No hacemos nada
			} else if (errorType=='java.io.FileNotFoundException') {
				$('#errorMessage').text('No se ha seleccionado un fichero de datos válido');
			} else if (errorType=='es.gob.afirma.keystores.AOCertificatesNotFoundException') {
				$('#errorMessage').text('No se ha encontrado ningún certificado de firma válido');
			} else if (errorType=='es.gob.afirma.standalone.ApplicationNotFoundException') {
				$('#errorMessage').text('No se pudo conectar con Autofirma. Compruebe que se encuentra instalado y reintente la operación');
			} else if(errorType=='es.gob.afirma.keystores.main.common.AOKeystoreAlternativeException') {
				$('#errorMessage').text('La contraseña indicada no es correcta');
			} else if(errorType=='java.lang.IllegalStateException') {
				$('#errorMessage').text('La contraseña indicada no es correcta');
			} else {
				$('#errorMessage').text('Se produjo un error durante la operación de firma: ' + errorMessage);
			}
		}
	
		</script>
	
</body>
</html>
