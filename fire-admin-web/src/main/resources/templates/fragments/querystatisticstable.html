<!-- Tabla resumen -->
<h4 th:if="${queryStatisticsResult != ''}" class="c-grey-900 mB-20 mt-5" th:text="${tableStatisticsTitle}"></h4>
<div class="statsViewControl">
	<button class="statsViewControlButton" id="statsViewButtonTable">
		<span class="icon-holder mR-10">
          <i class="ti-layout"></i>
        </span> Table
    </button>
	<button class="statsViewControlButton" id="statsViewButtonDoughnut" th:if="${enableDonutChart}">
		<span class="icon-holder mR-10">
          <i class="ti-pie-chart"></i>
        </span> Donut
	</button>
	<button class="statsViewControlButton" id="statsViewButtonBar" th:if="${enableBarChart}">
		<span class="icon-holder mR-10">
          <i class="ti-bar-chart"></i>
        </span> Barras
	</button>
	<button class="statsViewControlButton" id="statsViewButtonBarTimeEvolution" th:if="${enableBarTimeChart}">
		<span class="icon-holder mR-10">
          <i class="ti-bar-chart"></i>
        </span> Barras Evolucion
	</button>
</div>

<!-- Contenedor de la vista Table -->
<div id="tableContainer" class="masonry-sizer p-20 bgc-white">
	<table id="queryStatisticsTable" class="display" style="cellspacing: 0; width: 100%;">
		<thead th:if="${isQueryByAppOrProvider}">
			<tr>
				<th th:text="#{table.statistics.name}">Nombre</th>
				<th th:text="#{table.statistics.correct}">Correctas</th>
				<th th:text="#{table.statistics.incorrect}">Incorrectas</th>
				<th th:text="#{table.statistics.total}">Total</th>
			</tr>
		</thead>
		<tbody th:if="${isQueryByAppOrProvider}">
			<tr th:each="result : ${queryStatisticsResult}">
				<td th:text="${result.name}"></td>
				<td th:text="${result.corrects}"></td>
				<td th:text="${result.incorrects}"></td>
				<td th:text="${result.total}"></td>
			</tr>
		</tbody>
		
		<thead th:if="${isQueryByDatesSize}">
			<tr>
				<th th:text="#{table.statistics.name}">Nombre</th>
				<th th:text="#{table.statistics.size}">Megabyte</th>
			</tr>
		</thead>
		<tbody th:if="${isQueryByDatesSize}">
			<tr th:each="result : ${queryStatisticsResult}">
				<td th:text="${result.name}"></td>
				<td th:text="${result.sizeBytes}"></td>
			</tr>
		</tbody>
		
		<thead th:if="${isQueryByOperation}">
			<tr>
                <th colspan="1"></th>
                <th colspan="3" th:text="#{table.statistics.operation.simple}" style="text-align: center;">Oper. Simple</th>
                <th colspan="3" th:text="#{table.statistics.operation.lotes}" style="text-align: center;">Oper. Lotes</th>
            </tr>
			<tr>
				<th th:text="#{table.statistics.name}">Nombre</th>
				<th th:text="#{table.statistics.correct}">Correctas</th>
				<th th:text="#{table.statistics.incorrect}">Incorrectas</th>
				<th th:text="#{table.statistics.total}">Total</th>
				<th th:text="#{table.statistics.correct}">Correctas</th>
				<th th:text="#{table.statistics.incorrect}">Incorrectas</th>
				<th th:text="#{table.statistics.total}">Total</th>
			</tr>
		</thead>
		<tbody th:if="${isQueryByOperation}">
			<tr th:each="result : ${queryStatisticsResult}">
				<td th:text="${result.name}"></td>
				<td th:text="${result.correctSimpleSignatures}"></td>
				<td th:text="${result.incorrectSimpleSignatures}"></td>
				<td th:text="${result.totalSimple}"></td>
				<td th:text="${result.correctBatchSignatures}"></td>
				<td th:text="${result.incorrectBatchSignatures}"></td>
				<td th:text="${result.totalBatch}"></td>
			</tr>
		</tbody>
		<thead th:if="${isSignatureQuery}">
			<tr>
				<th th:text="#{table.statistics.name}">Nombre</th>
				<th th:text="#{table.statistics.correct}">Correctas</th>
				<th th:text="#{table.statistics.incorrect}">Incorrectas</th>
				<th th:text="#{table.statistics.total}">Total</th>
			</tr>
		</thead>
		<tbody th:if="${isSignatureQuery}">
			<tr th:each="result : ${queryStatisticsResult}">
				<td th:text="${result.name}"></td>
				<td th:text="${result.corrects}"></td>
				<td th:text="${result.incorrects}"></td>
				<td th:text="${result.total}"></td>
			</tr>
		</tbody>
	</table>
</div>

<!-- Contenedor de la vista Doughnut -->
<div id="doughnutChartContainer" class="masonry-sizer p-20 bgc-white" style="display: none;">
  <div style="display: flex; justify-content: space-around; align-items: flex-start; flex-wrap: wrap;">
    <!-- Grafico Donut para Correctas vs Incorrectas -->
    <div style="width: 45%; text-align: center;">
      <h3>Correctas vs Incorrectas</h3>
      <canvas id="doughnutChartCorrectas"></canvas>
    </div>
    <!-- Grafico Donut para Distribucion Total por Nombre -->
    <div style="width: 45%; text-align: center;">
      <h3>Total por Nombre</h3>
      <canvas id="doughnutChartTotales"></canvas>
    </div>
  </div>
</div>

<!-- Contenedor de la vista Bar -->
<div id="barChartContainer" class="masonry-sizer p-20 bgc-white" style="display: none;">
	<canvas id="barChart"></canvas>
</div>

<!-- Contenedor de la vista Bar -->
<div id="barTimeEvolutionChartContainer" class="masonry-sizer p-20 bgc-white" style="display: none;">
	<canvas id="barTimeEvolutionChart"></canvas>
</div>

<script th:inline="javascript">
var doughnutChart, doughnutChartTotales, barChart; // Variables para almacenar las instancias de Chart.js

function str2bytes(str) {
   var bytes = new Uint8Array(str.length);
   for (var i=0; i<str.length; i++) {
      bytes[i] = str.charCodeAt(i);
    }
    return bytes;
}

function generateBaseHue(index, total) {
  return index * 360 / total;
}

function generateCorrectColor(hue) {
  return `hsl(${hue}, 70%, 50%)`;
}

function generateIncorrectColor(hue) {
  return `hsl(${hue}, 70%, 70%)`;
}

function generateCorrectBatchColor(hue) {
  return `hsl(${hue}, 80%, 50%)`;
}
function generateIncorrectBatchColor(hue) {
  return `hsl(${hue}, 80%, 70%)`;
}

$(document).ready(function() {
	var buttonCommon = {
        exportOptions: {
            format: {
                body: function ( data, row, column, node ) {
                    return data;
                }
            }
        }
    };
	
	var titleTable = [[${tableStatisticsTitle}]];
	
	var tableStatisticsQuery = $('#queryStatisticsTable').DataTable({
		"pagingType" : "full_numbers",
		"initComplete" : function(settings, json) {
			//eliminamos el scroll inferior
			$('#queryStatisticsTable_wrapper .dataTables_scrollBody').css("overflow-x", "hidden");
		},
		dom: 'Bfrtip',
		buttons: [
            $.extend(true, {}, buttonCommon, {
                extend: 'csvHtml5',
                filename: function(){
                	var query = $("#query option:selected").val();
                    return query;
                }
            } ),
            $.extend(true, {}, buttonCommon, {
                extend: 'excelHtml5',
                title: 'Informe de Estadisticas de FIRe',
                filename: function(){
                	var query = $("#query option:selected").val();
                    return query;
                }
            })
        ],
        "charset": "utf-8",
		"language": {
	        "url": "js/datatables/i18n/spanish.json",
	        select: {
	            rows: {
	                _: "%d filas seleccionadas",
	                1: "1 fila seleccionada"
	            }
	          }
	        },
		"order" : [ 0, 'desc' ],
		responsive : {
			details : {
				type : 'column',
				target : -1
			}
		}

	});
	
	$("thead tr").css("border-bottom","1px solid #000");
	
	// Boton Table: muestra la tabla y oculta los graficos
    $("#statsViewButtonTable").click(function(){
      $("#tableContainer").show();
      $("#doughnutChartContainer").hide();
      $("#barChartContainer").hide();
      $("#barTimeEvolutionChartContainer").hide();
    });
	
 	// Boton Doughnut: muestra los graficos Doughnut y oculta las demas vistas
	$("#statsViewButtonDoughnut").click(function() {
		$("#tableContainer").hide();
		$("#barChartContainer").hide();
		$("#doughnutChartContainer").show();
	    $("#barTimeEvolutionChartContainer").hide();
		
		var results = /*[[${queryStatisticsResult}]]*/ [];
		var totalCorrect = 0;
		var totalIncorrect = 0;
		var names = [];
		var totals = [];
		var isApplicable = /*[[${isSignatureQuery} or ${isQueryByAppOrProvider}]]*/ false;
	    
      	if (isApplicable) {
      		for (var i = 0; i < results.length; i++) {
    			totalCorrect += results[i].corrects;
    			totalIncorrect += results[i].incorrects;
    			names.push(results[i].name);
    			totals.push(results[i].total);
    		}
    		
    		// Grafico 1: Proporcion global de Correctas vs Incorrectas
    		var ctxCorrectas = document.getElementById("doughnutChartCorrectas").getContext("2d");

    			type: 'doughnut',
    			data: {
    				labels: ['Correctas', 'Incorrectas'],
    				datasets: [{

    					backgroundColor: ['#36A2EB', '#FF6384']
    				}]
    			},
    			options: {
    				responsive: true,
    				title: {
    					display: true,
    					text: 'Proporcion Global de Correctas vs Incorrectas'
    				},
    				tooltips: {
    					callbacks: {
    						label: function(tooltipItem, data) {
    							var dataset = data.datasets[tooltipItem.datasetIndex];
    							var total = dataset.data.reduce(function(prev, curr) { return prev + curr; });
    							var currentValue = dataset.data[tooltipItem.index];
    							var percentage = Math.floor(((currentValue / total) * 100) + 0.5);
    							return data.labels[tooltipItem.index] + ": " + percentage + "%";
    						}
    					}
    				}
    			}
    		});
    		
    		var colors = [];
    		var index = 0;
    		for (var i = 0; i < totals.length; i++) {
    			var hue = generateBaseHue(index, totals.length);
        		var correctColor = generateCorrectColor(hue);
        		
    		    colors.push(correctColor);
    		    index++;
    		}
    		
    		// Grafico 2: Distribucion total por Nombre
    		var ctxTotales = document.getElementById("doughnutChartTotales").getContext("2d");
    		doughnutChartTotales = new Chart(ctxTotales, {
    			type: 'doughnut',
    			data: {
    				labels: names,
    				datasets: [{
    					data: totals,
    					backgroundColor: colors
    				}]
    			},
    			options: {
    				responsive: true,
    				title: {
    					display: true,
    					text: 'Distribucion Total por Nombre'
    				},
    				tooltips: {
    					callbacks: {
    						label: function(tooltipItem, data) {
    							var dataset = data.datasets[tooltipItem.datasetIndex];
    							var total = dataset.data.reduce(function(prev, curr) { return prev + curr; });
    							var currentValue = dataset.data[tooltipItem.index];
    							var percentage = Math.floor(((currentValue / total) * 100) + 0.5);
    							return data.labels[tooltipItem.index] + ": " + percentage + "%";
    						}
    					}
    				}
    			}
    		});
      	} else {
			var isQueryByOperation = /*[[${isQueryByOperation}]]*/ false;
	    	
	    	if (isQueryByOperation) {
	    		var results = /*[[${queryStatisticsResult}]]*/ [];
	    		  
				var simpleTotalCorrect = 0;
				var simpleTotalIncorrect = 0;
				var batchTotalCorrect = 0;
				var batchTotalIncorrect = 0;
				var labels = [];
				var totalsSimple = [];
				var totalsBatch = [];
				
				for (var i = 0; i < results.length; i++) {
					simpleTotalCorrect += results[i].correctSimpleSignatures;
					simpleTotalIncorrect += results[i].incorrectSimpleSignatures;
					batchTotalCorrect += results[i].correctBatchSignatures;
					batchTotalIncorrect += results[i].incorrectBatchSignatures;
					labels.push(results[i].name);
					totalsSimple.push(results[i].totalSimple);
					totalsBatch.push(results[i].totalBatch);
				}
				
				var ctx = document.getElementById("doughnutChartCorrectas").getContext("2d");
				doughnutChart = new Chart(ctx, {
				    type: 'doughnut',
				    data: {
				      labels: ['Correctas', 'Incorrectas'],
				      datasets: [
				        {
				          label: 'Simple',
				          data: [simpleTotalCorrect, simpleTotalIncorrect],
				          backgroundColor: ['#36A2EB', '#FF6384']
				        },
				        {
				          label: 'Batch',
				          data: [batchTotalCorrect, batchTotalIncorrect],
				          backgroundColor: ['#4BC0C0', '#FFCE56']
				        }
				      ]
				    },
				    options: {
				      responsive: true,
				      title: {
				        display: true,
				        text: 'Distribucion de Firmas: Simple vs Batch'
				      },
				      tooltips: {
				        callbacks: {
				          label: function(tooltipItem, data) {
				            var datasetIndex = tooltipItem.datasetIndex;
				            var datasetLabel = data.datasets[datasetIndex].label;
				            var currentValue = data.datasets[datasetIndex].data[tooltipItem.index];
				            var total = data.datasets[datasetIndex].data.reduce(function(prev, curr) {
				              return prev + curr;
				            }, 0);
				            var percentage = Math.floor(((currentValue / total) * 100) + 0.5);
				            return datasetLabel + " - " + data.labels[tooltipItem.index] + ": " + percentage + "% (" + currentValue + ")";
				          }
				        }
				      }
				    }
				  });
				
				var simpleColors = [];
				var batchColors = [];
	    		var index = 0;
	    		for (var i = 0; i < totalsSimple.length; i++) {
	    			var hue = generateBaseHue(index, totalsSimple.length);
	        		var simpleColor = generateCorrectColor(hue);
	        		
	        		simpleColors.push(simpleColor);
	        		index++;
	    		}

	    		index = 0;
	    		for (var i = 0; i < totalsBatch.length; i++) {
	    			var hue = generateBaseHue(index, totalsBatch.length);
	        		var batchColor = generateCorrectBatchColor(hue);
	        		
	        		batchColors.push(batchColor);
	        		index++;
	    		}
				
				// Grafico 2: Distribucion total por Nombre
	    		var ctxTotales = document.getElementById("doughnutChartTotales").getContext("2d");
				
	    		doughnutChartTotales = new Chart(ctxTotales, {
	    		    type: 'doughnut',
	    		    data: {
	    		      labels: labels,
	    		      datasets: [
	    		        {
	    		          label: 'Simple',
	    		          data: totalsSimple,
	    		          backgroundColor: simpleColors
	    		        },
	    		        {
	    		          label: 'Batch',
	    		          data: totalsBatch,
	    		          backgroundColor: batchColors
	    		        }
	    		      ]
	    		    },
	    		    options: {
	    		      responsive: true,
	    		      title: {
	    		        display: true,
	    		        text: 'Total de Entradas Simple y Batch por Nombre'
	    		      },
	    		      tooltips: {
	    		        callbacks: {
	    		          label: function(tooltipItem, data) {
	    		            var dsIndex = tooltipItem.datasetIndex;
	    		            var dataset = data.datasets[dsIndex];
	    		            var currentValue = dataset.data[tooltipItem.index];
	    		            var total = dataset.data.reduce(function(prev, curr) { return prev + curr; }, 0);
	    		            var percentage = Math.floor((currentValue / total) * 100 + 0.5);
	    		            return dataset.label + " - " + data.labels[tooltipItem.index] + ": " + percentage + "% (" + currentValue + ")";
	    		          }
	    		        }
	    		      }
	    		    }
	    		  });
	    	} else {
	    	    var results = /*[[${queryStatisticsResult}]]*/ [];
	    	    results.sort(function(a, b) {
	    	      return a.sizeBytes - b.sizeBytes;
	    	    });
	    	    
	    	    var labels = results.map(function(item) {
	    	      return item.name;
	    	    });
	    	    
	    	    var sizes = results.map(function(item) {
	    	      return item.sizeBytes;
	    	    });
	    	    
	    	    var ctx = document.getElementById("doughnutChartCorrectas").getContext("2d");
	    	    doughnutChart = new Chart(ctx, {
	    	      type: 'doughnut',
	    	      data: {
	    	        labels: labels,
	    	        datasets: [{
	    	          data: sizes,
	    	          backgroundColor: ['#36A2EB', '#FF6384', '#FFCE56', '#4BC0C0', '#9966FF']
	    	        }]
	    	      },
	    	      options: {
	    	        responsive: true,
	    	        title: {
	    	          display: true,
	    	          text: 'Distribucion de Tamaños (ordenados de menor a mayor)'
	    	        },
	    	        tooltips: {
	    	          callbacks: {
	    	            label: function(tooltipItem, data) {
	    	              var dataset = data.datasets[tooltipItem.datasetIndex];
	    	              var total = dataset.data.reduce(function(prev, curr) { return prev + curr; }, 0);
	    	              var currentValue = dataset.data[tooltipItem.index];
	    	              var percentage = Math.floor(((currentValue / total) * 100) + 0.5);
	    	              return data.labels[tooltipItem.index] + ": " + percentage + "% (" + currentValue + " Bytes)";
	    	            }
	    	          }
	    	        }
	    	      }
	    	    });
	    	}
      	}
	});
	
	// Boton Bar: muestra el Grafico de barras apilado y oculta las demas vistas
	$("#statsViewButtonBar").click(function(){
	  $("#tableContainer").hide();
	  $("#doughnutChartContainer").hide();
	  $("#barChartContainer").show();
      $("#barTimeEvolutionChartContainer").hide();
      
	  var isApplicable = /*[[${isSignatureQuery} or ${isQueryByAppOrProvider}]]*/ false;
	    
      if (isApplicable) {
	      var results = /*[[${queryStatisticsResult}]]*/ [];
	      var names = [];
	      var corrects = [];
	      var incorrects = [];
	      
	      for (var i = 0; i < results.length; i++) {
	        names.push(results[i].name);
	        corrects.push(results[i].corrects);
	        incorrects.push(results[i].incorrects);
	      }
	      
	      var ctx = document.getElementById("barChart").getContext("2d");

	              data: corrects,
	              backgroundColor: '#36A2EB'
	            },
	            {
	              label: 'Incorrectas',
	              data: incorrects,
	              backgroundColor: '#FF6384'
	            }

	        },

	          responsive: true,

	            display: true,
	            text: 'Grafico de Barras Apilado'

	            xAxes: [{
	              stacked: true
	            }],
	            yAxes: [{
	              stacked: true
	            }]

	      });
	      
	    } else {
	    	var isQueryByOperation = /*[[${isQueryByOperation}]]*/ false;
	    	
	    	if (isQueryByOperation) {
	    		var results = /*[[${queryStatisticsResult}]]*/ [];
	    		var labels = [];
				var simpleCorrect = [];

				for (var i = 0; i < results.length; i++) {

					simpleCorrect.push(results[i].correctSimpleSignatures);

				var ctx = document.getElementById("barChart").getContext("2d");

			        type: 'bar',

			              data: simpleIncorrect,
			              backgroundColor: '#FF6384',
			              stack: 'Stack 1'
			            },
			            {
			              label: 'Batch Correctas',
			              data: batchCorrect,
			              backgroundColor: '#4BC0C0',
			              stack: 'Stack 2'
			            },
			            {
			              label: 'Batch Incorrectas',
			              data: batchIncorrect,

			        },
			        options: {
			          responsive: true,
			          title: {
			            display: true,
			            text: 'Stacked Bar Chart with Groups'
			          },
			          scales: {
			            xAxes: [{
			              stacked: true
			            }],
			            yAxes: [{
			              stacked: true
			            }]
			          }
			        }
			      });
	    	} else {
	    		var results = /*[[${queryStatisticsResult}]]*/ [];
	    	    results.sort(function(a, b) {
	    	      return a.sizeBytes - b.sizeBytes;
	    	    });
	    	    
	    	    var labels = results.map(function(item) {
	    	      return item.name;
	    	    });
	    	    
	    	    var sizes = results.map(function(item) {
	    	      return item.sizeBytes;
	    	    });
	    	    
	    	    var ctx = document.getElementById("barChart").getContext("2d");
	    	    barChart = new Chart(ctx, {
	    	      type: 'bar',
	    	      data: {
	    	        labels: labels,

	    	          data: sizes,
	    	          backgroundColor: '#36A2EB'
	    	        }]
	    	      },
	    	      options: {
	    	        responsive: true,
	    	        title: {
	    	          display: true,
	    	          text: 'Tamaño de Transacciones ordenadas de menor a mayor'
	    	        },
	    	        scales: {
	    	          yAxes: [{
	    	            ticks: {
	    	              beginAtZero: true
	    	            }
	    	          }]
	    	        }
	    	      }
	    	    });
	    	}
	    }
	});
	
	// Boton Table: muestra la tabla y oculta los graficos
    $("#statsViewButtonBarTimeEvolution").click(function(){
      $("#tableContainer").hide();
      $("#doughnutChartContainer").hide();
      $("#barChartContainer").hide();
      $("#barTimeEvolutionChartContainer").show();
      
      var statisticsByMonth = /*[[${queryStatisticsByMonth}]]*/ [];
      
      console.log(statisticsByMonth);
      
      var isApplicable = /*[[${isSignatureQuery} or ${isQueryByAppOrProvider}]]*/ false;
      
      if (isApplicable) {
    	  var labels = Object.keys(statisticsByMonth).sort(function(a, b) {
              var partsA = a.split('/');
              var partsB = b.split('/');
              
              var yearA = parseInt(partsA[1], 10), monthA = parseInt(partsA[0], 10);
              var yearB = parseInt(partsB[1], 10), monthB = parseInt(partsB[0], 10);
              return (yearA - yearB) || (monthA - monthB);
          });
          
          var namesSet = {};
          
          labels.forEach(function(monthKey) {
              statisticsByMonth[monthKey].forEach(function(entry) {
            	  namesSet[entry.name] = true;
              });
          });
          
          var names = Object.keys(namesSet);
          
          var data = {};
          
          names.forEach(function(name) {
        	    data[name] = {
        	        corrects: new Array(labels.length).fill(0),
        	        incorrects: new Array(labels.length).fill(0)
        	    };
        	});

          labels.forEach(function(monthKey, monthIndex) {
        	    statisticsByMonth[monthKey].forEach(function(entry) {
        	        var entryName = entry.name;
        	        data[entryName].corrects[monthIndex] = entry.corrects;
        	        data[entryName].incorrects[monthIndex] = entry.incorrects;
        	    });
        	});
          
          var totalEntries = names.length;
          var index = 0;
          var datasets = [];

          for (var entry in data) {
      		var hue = generateBaseHue(index, totalEntries);
    		var correctColor = generateCorrectColor(hue);
   			var incorrectColor = generateIncorrectColor(hue);
	       	  datasets.push({
	       	        label: entry + " - Correctas",
	       	        data: data[entry].corrects,
	       	        backgroundColor: correctColor ,
	       	        borderColor: correctColor ,
	       	        borderWidth: 1,
	       	        stack: entry  // Mismo stack para agrupar correctas e incorrectas de la misma aplicacion
	       	    });
	       	    // Dataset para transacciones incorrectas de la aplicacion
	       	    datasets.push({
	       	        label: entry + " - Incorrectas",
	       	        data: data[entry].incorrects,
	       	        backgroundColor: incorrectColor,
	       	        borderColor: incorrectColor,
	       	        borderWidth: 1,
	       	        stack: entry  // Mismo stack para que se apile sobre las correctas
	       	    });
	       	    index++;
          }
          
          var timeEvolutionCtx = document.getElementById('barTimeEvolutionChart').getContext('2d');
          
          var timeEvolutionChart = new Chart(timeEvolutionCtx, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: datasets
              },
              options: {
                responsive: true,
                scales: {
                  x: {
                    stacked: true,
                    title: {
                      display: true,
                      text: 'Mes/Año'
                    }
                  },
                  y: {
                    stacked: true,
                    beginAtZero: true,
                    title: {
                      display: true,
                      text: 'Numero de Transacciones'
                    }
                  }
                }
              }
            });
      } else {
		  var isQueryByOperation = /*[[${isQueryByOperation}]]*/ false;
		  
    	  if (isQueryByOperation) {
    			// 1. Extraer y ordenar las etiquetas del eje X (meses en formato "MM/YYYY")
     	    	var labels = Object.keys(statisticsByMonth).sort(function(a, b) {
	      	      var partsA = a.split('/');
	      	      var partsB = b.split('/');
	      	      var yearA = parseInt(partsA[1], 10), monthA = parseInt(partsA[0], 10);
	      	      var yearB = parseInt(partsB[1], 10), monthB = parseInt(partsB[0], 10);
	      	      return (yearA - yearB) || (monthA - monthB);
	      	    });
    			
     	    	// 2. Obtener la lista unica de nombres de aplicaciones
     	       var appSet = {};
     	       labels.forEach(function(monthKey) {
     	         statisticsByMonth[monthKey].forEach(function(entry) {
     	           appSet[entry.name] = true;
     	         });
     	       });
     	       var appNames = Object.keys(appSet);
     	       
    	   		// 3. Preparar la estructura de datos por aplicacion
     	      var appData = {};
     	      appNames.forEach(function(app) {
     	        appData[app] = {
     	          correctSimple: new Array(labels.length).fill(0),
     	          incorrectSimple: new Array(labels.length).fill(0),
     	          correctBatch: new Array(labels.length).fill(0),
     	          incorrectBatch: new Array(labels.length).fill(0)
     	        };
     	      });
     	      
     	  		// 4. Rellenar los arrays segun los datos de cada mes
     	     labels.forEach(function(monthKey, monthIndex) {
     	       statisticsByMonth[monthKey].forEach(function(entry) {
     	         var app = entry.name;
     	         appData[app].correctSimple[monthIndex] = entry.correctSimpleSignatures || 0;
     	         appData[app].incorrectSimple[monthIndex] = entry.incorrectSimpleSignatures || 0;
     	         appData[app].correctBatch[monthIndex] = entry.correctBatchSignatures || 0;
     	         appData[app].incorrectBatch[monthIndex] = entry.incorrectBatchSignatures || 0;
     	       });
     	     });
     	  		
     	 	// 5. Crear los datasets para Chart.js.
     	 	var datasets = [];
		    var totalApps = appNames.length;
		    appNames.forEach(function(app, index) {
		      var hue = generateBaseHue(index, totalApps);
		      datasets.push({
		        label: app + " - Simple Correctas",
		        data: appData[app].correctSimple,
		        backgroundColor: generateCorrectColor(hue),
		        borderColor: generateCorrectColor(hue),
		        borderWidth: 1,
		        stack: app + "-simple"
		      });
		      datasets.push({
		        label: app + " - Simple Incorrectas",
		        data: appData[app].incorrectSimple,
		        backgroundColor: generateIncorrectColor(hue),
		        borderColor: generateIncorrectColor(hue),
		        borderWidth: 1,
		        stack: app + "-simple"
		      });
		      datasets.push({
		        label: app + " - Batch Correctas",
		        data: appData[app].correctBatch,
		        backgroundColor: generateCorrectBatchColor(hue),
		        borderColor: generateCorrectBatchColor(hue),
		        borderWidth: 1,
		        stack: app + "-batch"
		      });
		      datasets.push({
		        label: app + " - Batch Incorrectas",
		        data: appData[app].incorrectBatch,
		        backgroundColor: generateIncorrectBatchColor(hue),
		        borderColor: generateIncorrectBatchColor(hue),
		        borderWidth: 1,
		        stack: app + "-batch"
		      });
		    });
		    
	 		// 6. Configurar el Grafico de barras apiladas
		    var timeEvolutionCtx = document.getElementById('barTimeEvolutionChart').getContext('2d');
          
          	var timeEvolutionChart = new Chart(timeEvolutionCtx, {
		      type: 'bar',
		      data: {
		        labels: labels, // Los meses ordenados
		        datasets: datasets
		      },
		      options: {
		        responsive: true,
		        plugins: {
		          title: {
		            display: true,
		            text: 'Evolucion Mensual de Firmas por Aplicacion'
		          }
		        },
		        scales: {
		          x: {
		            stacked: true,
		            title: {
		              display: true,
		              text: 'Mes/Año'
		            }
		          },
		          y: {
		            stacked: true,
		            beginAtZero: true,
		            title: {
		              display: true,
		              text: 'Numero de Firmas'
		            }
		          }
		        }
		      }
		    });
     	 	//Fin de procesado de grafico de barras de Simples y Batch
    	  } else {
    			// 1. Extraer y ordenar las etiquetas (meses) en formato "MM/YYYY"
    		    var labels = Object.keys(statisticsByMonth).sort(function(a, b) {
    		      var partsA = a.split('/');
    		      var partsB = b.split('/');
    		      var yearA = parseInt(partsA[1], 10), monthA = parseInt(partsA[0], 10);
    		      var yearB = parseInt(partsB[1], 10), monthB = parseInt(partsB[0], 10);
    		      return (yearA - yearB) || (monthA - monthB);
    		    });
    			
    		 	// 2. Extraer la lista unica de aplicaciones
    		    var appSet = {};
    		    labels.forEach(function(monthKey) {
    		      statisticsByMonth[monthKey].forEach(function(entry) {
    		        appSet[entry.name] = true;
    		      });
    		    });
    		    var appNames = Object.keys(appSet);
    		    
    		 	// 3. Preparar la estructura de datos para cada aplicacion
    		    var appData = {};
    		    appNames.forEach(function(app) {
    		      appData[app] = new Array(labels.length).fill(0);
    		    });
    		    
    		 	// 4. Rellenar la estructura: para cada mes, asignar el valor de sizeBytes para cada aplicacion
    		    labels.forEach(function(monthKey, index) {
    		      statisticsByMonth[monthKey].forEach(function(entry) {
    		        var app = entry.name;
    		        appData[app][index] = entry.sizeBytes || 0;
    		      });
    		    });
    		    
    		 	// 5. Construir los datasets para Chart.js: un dataset por aplicacion
    		    var datasets = [];
    		    var totalApps = appNames.length;
    		    appNames.forEach(function(app, index) {
    		      var hue = generateBaseHue(index, totalApps);
    		      var color = generateCorrectColor(hue);
    		      datasets.push({
    		        label: app,
    		        data: appData[app],
    		        backgroundColor: color,
    		        borderColor: color,
    		        borderWidth: 1
    		      });
    		    });
    		    
    		 	// 7. Crear el Grafico de barras
    		    var timeEvolutionCtx = document.getElementById('barTimeEvolutionChart').getContext('2d');
          
          		var timeEvolutionChart = new Chart(timeEvolutionCtx, {
    		      type: 'bar',
    		      data: {
    		        labels: labels,  // Meses ordenados
    		        datasets: datasets
    		      },
    		      options: {
    		        responsive: true,
    		        scales: {
    		          x: {
    		            title: {
    		              display: true,
    		              text: 'Mes/Año'
    		            },
    		            // Si deseas barras agrupadas, no se necesita "stacked"
    		            stacked: false 
    		          },
    		          y: {
    		            beginAtZero: true,
    		            title: {
    		              display: true,
    		              text: 'Tamaño (Bytes)'
    		            }
    		          }
    		        }
    		      }
    		    });
    	  }
      }
      //
    });
});
