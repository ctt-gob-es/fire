<div class="row gap-20 masonry pos-r">
  <div class="masonry-item col-md-12">
    <div class="bgc-white p-20 bd full-height-root">
      <h4 class="c-grey-900" th:text="#{query.statistics.admin}"></h4>
      
      <input type="hidden" id="maxEntitiesBeforeGrouping" th:value="${maxEntitiesBeforeGrouping}" class="form-control" />

      <!-- Botón para mostrar/ocultar filtros -->
      <div class="mb-3">
        <button
          id="showFilterBtn"
          type="button"
          class="btn btn-primary"
        >
        <span class="icon-holder mR-10"><i class="ti-search"></i></span>
        <span th:text="#{button.statistics.query}"></span>
        </button>
      </div>
      
      <div id="noResultsContainer" style="display:none;">
		  <div class="no-results-card">
		    <div class="icon-container">
		      <i class="ti-alert big-icon"></i>
		    </div>
		    <h5 class="no-results-title" th:text="#{form.statistics.noResultsTitle}"></h5>
		    <p class="no-results-message" th:text="#{form.statistics.noResultsMessage}">
		    </p>
		    <div class="filters-used">
		      <h6 th:text="#{form.statistics.appliedFiltersTitle}"></h6>
		      <div id="noResultsFiltersContainer">
		        <!-- Aquí se insertan dinámicamente las burbujas de filtro -->
		      </div>
		    </div>
		  </div>
	  </div>


      <!-- Sección de filtros aplicados y control de vistas -->
      <div id="filtersAndViews">
		  <!-- Filtros aplicados a la izquierda -->
		  <div id="activeFiltersSection">
		    <h6 th:text="#{section.statistics.activeFilters.title}">Filtros aplicados</h6>
		    <div id="activeFiltersContainer">
		      <!-- Aquí se insertan dinámicamente los filtros -->
		    </div>
		  </div>
		
		  <!-- Sección de control de vistas a la derecha, con título y botones en línea -->
		  <div id="statsViewSection">
		    <h6 th:text="#{section.statistics.viewControls.title}">Control de vistas</h6>
		    <div id="statsViewControl">
		      <button class="statsViewControlButton" id="statsViewButtonTable">
		        <span class="icon-holder mR-10"><i class="ti-layout"></i></span>
		        <span th:text="#{button.statistics.view.table}">Tabla</span>
		      </button>
		      <button class="statsViewControlButton" id="statsViewButtonDoughnut">
		        <span class="icon-holder mR-10"><i class="ti-pie-chart"></i></span>
		        <span th:text="#{button.statistics.view.doughnut}">Dona</span>
		      </button>
		      <button class="statsViewControlButton" id="statsViewButtonBar">
		        <span class="icon-holder mR-10"><i class="ti-bar-chart"></i></span>
		        <span th:text="#{button.statistics.view.bar}">Barras</span>
		      </button>
		      <button class="statsViewControlButton" id="statsViewButtonBarTimeEvolution">
		        <span class="icon-holder mR-10"><i class="ti-bar-chart"></i></span>
		        <span th:text="#{button.statistics.view.barTimeEvolution}">Evolución</span>
		      </button>
		    </div>
		  </div>
		</div>

      <div id="statisticsResultContainer">
        <!-- Tabla -->
        <div id="tableContainer" class="masonry-sizer bgc-white">
          <table id="queryStatisticsTable" class="display" cellspacing="0" width="100%">
            <thead><!-- dinámico --></thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Donut -->
        <div id="doughnutChartContainer" class="masonry-sizer bgc-white" style="display: none;">
          <div class="d-flex flex-wrap justify-content-around">
            <div style="width:45%; text-align:center">
              <h3 th:text="#{chart.statistics.correctVsIncorrectas}"></h3>
              <canvas id="doughnutChartCorrectas"></canvas>
            </div>
            <div style="width:45%; text-align:center">
              <h3 th:text="#{chart.statistics.totalPorNombre}"></h3>
              <canvas id="doughnutChartTotales"></canvas>
            </div>
          </div>
        </div>

        <!-- Barras -->
        <div id="barChartContainer" class="masonry-sizer bgc-white" style="display: none;">
          <canvas id="barChart"></canvas>
        </div>

        <!-- Evolución en el tiempo -->
        <div id="barTimeEvolutionChartContainer" class="masonry-sizer bgc-white" style="display: none;">
          <canvas id="barTimeEvolutionChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

 <!-- Plantillas para las cabeceras (se activan según los flags devueltos en el DTO) -->
 <script type="text/template" id="header-appOrProvider">

    <th th:text="#{table.statistics.name}">Nombre</th>
	<th th:text="#{table.statistics.organization}">Organismo</th>

<script type="text/template" id="header-datesSize">
  <tr>
    <th th:text="#{table.statistics.name}">Nombre</th>
	<th th:text="#{table.statistics.organization}">Organismo</th>
    <th th:text="#{table.statistics.size}">Megabyte</th>
  </tr>
</script>

<script type="text/template" id="header-operation">
  <tr>
    <th colspan="1"></th>
	<th colspan="1"></th>
    <th colspan="3" th:text="#{table.statistics.operation.simple}" style="text-align: center;">Oper. Simple</th>
    <th colspan="3" th:text="#{table.statistics.operation.lotes}" style="text-align: center;">Oper. Lotes</th>
  </tr>
  <tr>
    <th th:text="#{table.statistics.name}">Nombre</th>
	<th th:text="#{table.statistics.organization}">Organismo</th>
    <th th:text="#{table.statistics.correct}">Correctas</th>
    <th th:text="#{table.statistics.incorrect}">Incorrectas</th>
    <th th:text="#{table.statistics.total}">Total</th>
    <th th:text="#{table.statistics.correct}">Correctas</th>
    <th th:text="#{table.statistics.incorrect}">Incorrectas</th>
    <th th:text="#{table.statistics.total}">Total</th>
  </tr>

<script type="text/template" id="header-signature">
  <tr>
    <th th:text="#{table.statistics.name}">Nombre</th>
	<th th:text="#{table.statistics.organization}">Organismo</th>
    <th th:text="#{table.statistics.correct}">Correctas</th>
    <th th:text="#{table.statistics.incorrect}">Incorrectas</th>
    <th th:text="#{table.statistics.total}">Total</th>
  </tr>
</script>

<script type="text/template" id="header-organization">
  <tr>
    <th th:text="#{table.statistics.name}">Nombre</th>
    <th th:text="#{table.statistics.correct}">Correctas</th>
    <th th:text="#{table.statistics.incorrect}">Incorrectas</th>
    <th th:text="#{table.statistics.total}">Total</th>
  </tr>
</script>

<script th:inline="javascript">
	var statisticsResponse;
	var doughnutChart, doughnutChartTotales, barChart;
	
	function str2bytes(str) {
	   var bytes = new Uint8Array(str.length);
	   for (var i=0; i<str.length; i++) {
	      bytes[i] = str.charCodeAt(i);
	    }
	    return bytes;
	}
	
	function generateBaseHue(index, total) {
	  return index * 360 / total;
	}
	
	function generateCorrectColor(hue) {
	  return `hsl(${hue}, 70%, 50%)`;
	}
	
	function generateIncorrectColor(hue) {
	  return `hsl(${hue}, 70%, 70%)`;
	}
	
	function generateCorrectBatchColor(hue) {
	  return `hsl(${hue}, 80%, 50%)`;
	}
	function generateIncorrectBatchColor(hue) {
	  return `hsl(${hue}, 80%, 70%)`;
	}

    // Instancias de Chart.js para poder destruirlas antes de regenerar
    var doughnutChartCorrect, doughnutChartTotals, barChart, timeEvolutionChart;

    $(document).ready(function () {
        // Configurar visibilidad inicial de botones según flags
        configureViewButtons();

        // Manejar clicks de la botonera de vistas
        $('#statsViewButtonTable').click(function () {
            showView('table');
        });
        $('#statsViewButtonDoughnut').click(function () {
            showView('doughnut');
            handleDoughnutView();
        });
        $('#statsViewButtonBar').click(function () {
        	showView('bar');
            handleBarView();
        });
        $('#statsViewButtonBarTimeEvolution').click(function () {
            showView('barTimeEvolution');
            handleBarTimeEvolutionView();
        });
        
        loadFilterModal();
    });
    
    $("#showFilterBtn").click(function(event) {
		var actionStatisticsFilterModal = /*[[@{/statisticsFilter}]]*/;
		event.preventDefault();

        $('#noResultsContainer').hide();
	    $('#filtersAndViews').hide();
	    $('#statisticsResultContainer').hide();
        
		$.ajax({
			url : actionStatisticsFilterModal,
			type : 'GET',
			cache : false,
			success : function(data) {
				hide();
				$('#modal').html(data);
				$('#statisticsFilterModal').modal('show');														
			},
			error : function(xhr) {
				if (xhr.status === 401 || xhr.status === 403) {
                    window.location.reload();
                } else {
                    console.error("Error al realizar la peticion");
                }
			}
		});
	});
    
    function loadFilterModal() {
        setTimeout(function () {
            $('#showFilterBtn').trigger('click');
        }, 500);
    }

 	// Oculta todos los botones de vista; sólo mostrará tabla tras cargar datos
    function configureViewButtons() {
        $('#filtersAndViews').hide();
        if (!statisticsResponse) return;
        // siempre mostrar botón de tabla cuando ya haya datos
        $('#statsViewButtonTable').show();
        if (statisticsResponse.enableDonutChart)      $('#statsViewButtonDoughnut').show();
        if (statisticsResponse.enableBarChart)        $('#statsViewButtonBar').show();
        if (statisticsResponse.enableBarTimeChart)    $('#statsViewButtonBarTimeEvolution').show();
    }

    // Oculta todos los contenedores y muestra el solicitado
    function showView(viewType) {
        $('#tableContainer, #doughnutChartContainer, #barChartContainer, #barTimeEvolutionChartContainer').hide();
        switch (viewType) {
            case 'table':
                $('#tableContainer').show();
                break;
            case 'doughnut':
                $('#doughnutChartContainer').show();
                break;
            case 'bar':
                $('#barChartContainer').show();
                break;
            case 'barTimeEvolution':
                $('#barTimeEvolutionChartContainer').show();
                break;
        }
    }

    function handleDoughnutView() {
        if (doughnutChartCorrect) doughnutChartCorrect.destroy();
        if (doughnutChartTotals)  doughnutChartTotals.destroy();
        
        const max = Math.max(0, (parseInt(document.getElementById("maxEntitiesBeforeGrouping").value) || 8) - 1);

        var datosGenerales = statisticsResponse.isSignatureQuery
            ? statisticsResponse.signatures
            : statisticsResponse.transactions;

        if (statisticsResponse.isSignatureQuery || statisticsResponse.isQueryWithCorrectAndIncorrect) {
        	const groupedFromValues = groupTopEntitiesByCorrectValues(datosGenerales, max);
        	
        	console.log(groupedFromValues);
        	
            drawDoughnutCorrectVsIncorrect(groupedFromValues);
            drawDoughnutTotalsByAppOrg(groupedFromValues);
        } else if (statisticsResponse.isQueryByOperation) {
			const groupedFromValues = groupTopEntitiesFromSignatureSources(datosGenerales, max);
        	
        	console.log(groupedFromValues);
        	
        	drawDoughnutOperationCharts(groupedFromValues);
        } else if (statisticsResponse.isQueryBySize) {
			const groupedFromValues = groupTopEntitiesByCorrectValues(datosGenerales, max);
        	
        	console.log(groupedFromValues);
        	
            drawDoughnutSizeChart(groupedFromValues);
        } else if (statisticsResponse.isQueryByOrganization) {
            var datosOrg = (statisticsResponse.signatures && statisticsResponse.signatures.length)
                ? statisticsResponse.signatures
                : statisticsResponse.transactions;
            
			const groupedFromValues = groupTopEntitiesByCorrectValues(datosGenerales, max);
        	
        	console.log(groupedFromValues);
        	
            drawDoughnutCorrectVsIncorrect(groupedFromValues);
            drawDoughnutOrganizationChart(groupedFromValues);
        } else {
			const groupedFromValues = groupTopEntitiesByCorrectValues(datosGenerales, max);
        	
        	console.log(groupedFromValues);
        	
            drawDoughnutTotalsByAppOrg(groupedFromValues);
        }
    }

    // Correctas vs Incorrectas
    function drawDoughnutCorrectVsIncorrect(data) {
        var corr = 0, incorr = 0;
        data.forEach(function (item) {
            corr += item.corrects || 0;
            incorr += item.incorrects || 0;
        });
        var ctx = document.getElementById('doughnutChartCorrectas').getContext('2d');
        doughnutChartCorrect = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Correctas', 'Incorrectas'],
                datasets: [{
                    data: [corr, incorr],
                    backgroundColor: ['#36A2EB', '#FF6384']
                }]
            },
            options: {
                responsive: true,
                title: { display: true, text: 'Correctas vs Incorrectas' },
                tooltips: {
                    callbacks: {
                        label: function (t, d) {
                            var label = d.labels[t.index];
                            var value = d.datasets[t.datasetIndex].data[t.index];
                            return label + ': ' + value;
                        }
                    }
                }
            }
        });
    }

    // Totales por App (agrupa orgs) y muestra cada segmento App (Org)
	function drawDoughnutTotalsByAppOrg(data) {
	    // 1) Ordenar para agrupar segmentos por name
	    var sortedData = data.slice().sort(function(a, b) {
	        return a.name.localeCompare(b.name);
	    });
	
	    // 2) Generar labels completos para tooltip y valores
	    var fullLabels = sortedData.map(function(item) {
	        return item.name + ' (' + item.organization + ')';
	    });
	    var values = sortedData.map(function(item) {
	        return item.total || 0;
	    });
	
	    // 3) Crear mapa de color único por name
	    var uniqueNames = Array.from(new Set(sortedData.map(function(item) {
	        return item.name;
	    })));
	    var colorMap = {};
	    uniqueNames.forEach(function(name, i) {
	        colorMap[name] = generateCorrectColor(generateBaseHue(i, uniqueNames.length));
	    });
	
	    // 4) Asignar color a cada segmento según su name
	    var colors = sortedData.map(function(item) {
	        return colorMap[item.name];
	    });
	
	    // 5) Dibujar el gráfico
	    var ctx = document.getElementById('doughnutChartTotales').getContext('2d');
	    doughnutChartTotals = new Chart(ctx, {
	        type: 'doughnut',
	        data: {
	            labels: fullLabels,
	            datasets: [{ data: values, backgroundColor: colors }]
	        },
	        options: {
	            responsive: true,
	            title: { display: true, text: 'Totales por Aplicación y Organización' },
	            plugins: {
	            	legend: {
	                    labels: {
	                        generateLabels: function(chart) {
	                            const bg = chart.data.datasets[0].backgroundColor;
	                            const idxPorNombre = {};
	                            chart.data.labels.forEach((full, i) => {
	                                const nombre = full.split(' (')[0];
	                                if (idxPorNombre[nombre] === undefined) {
	                                    idxPorNombre[nombre] = i;
	                                }
	                            });
	                            return Object.keys(idxPorNombre).map(nombre => {
	                                const idx = idxPorNombre[nombre];
	                                return {
	                                    text: nombre,
	                                    fillStyle: bg[idx],
	                                    hidden: false,
	                                    index: idx
	                                };
	                            });
	                        }
	                    },
	                    onClick: function(evt, legendItem, legend) {
	                        const chart = legend.chart;
	                        const nombreClicado = legendItem.text;
	                        // alternar visibilidad de TODOS los segmentos con ese nombre
	                        chart.data.labels.forEach((full, i) => {
	                            if (full.split(' (')[0] === nombreClicado) {
	                                const meta = chart.getDatasetMeta(0);
	                                meta.data[i].hidden = !meta.data[i].hidden;
	                            }
	                        });
	                        chart.update();
	                    }
	                }
	            },
	            tooltips: {
	                callbacks: {
	                    label: function(t, data) {
	                        const lbl = data.labels[t.index];
	                        const val = data.datasets[0].data[t.index];
	                        return lbl + ': ' + val;
	                    }
	                }
	            }
	        }
	    });
	}

    // Simple vs Batch (Correct/Incorrect) + Totales Simple/Batch por App (Org)
	function drawDoughnutOperationCharts(data) {
	    // 1) calcular totales para el primer doughnut (Simple vs Batch)
	    var simpleCorrect = 0, simpleIncorrect = 0, batchCorrect = 0, batchIncorrect = 0;
	    data.forEach(function(item) {
	        simpleCorrect   += item.correctSimpleSignatures   || 0;
	        simpleIncorrect += item.incorrectSimpleSignatures || 0;
	        batchCorrect    += item.correctBatchSignatures    || 0;
	        batchIncorrect  += item.incorrectBatchSignatures  || 0;
	    });
	
	    // 2) ordenar data por name para agrupar segmentos en el segundo doughnut
	    var sorted = data.slice().sort(function(a, b) {
	        return a.name.localeCompare(b.name);
	    });
	
	    // 3) construir labels completos y valores para Totales por App (Org)
	    var fullLabels = sorted.map(function(item) {
	        return item.name + ' (' + item.organization + ')';
	    });
	    var valsSimple = sorted.map(function(item) {
	        return item.totalSimple || 0;
	    });
	    var valsBatch  = sorted.map(function(item) {
	        return item.totalBatch  || 0;
	    });
	
	    // 4) generar color único por name
	    var uniqueNames = Array.from(new Set(sorted.map(function(item) {
	        return item.name;
	    })));
	    var nameColorMap = {};
	    uniqueNames.forEach(function(name, i) {
	        nameColorMap[name] = generateCorrectColor(generateBaseHue(i, uniqueNames.length));
	    });
	    // asignar color a cada segmento
	    var segmentColors = sorted.map(function(item) {
	        return nameColorMap[item.name];
	    });
	
	    // === Primer doughnut: Simple vs Batch (Correctas/Incorrectas) ===
	    var ctx1 = document.getElementById('doughnutChartCorrectas').getContext('2d');
		if (doughnutChartCorrect) doughnutChartCorrect.destroy();
		
		// definimos los hue para los colores
		var hueSimple = 207;
		var hueBatch  = 174;
	    doughnutChartCorrect = new Chart(ctx1, {
	        type: 'doughnut',
	        data: {
	            labels: ['Correctas', 'Incorrectas'],
	            datasets: [
	                {
	                    label: 'Simple',
	                    data: [simpleCorrect, simpleIncorrect],
	                    backgroundColor: [
	                        '#36A2EB',
	                        generateIncorrectColor(hueSimple)
	                    ]
	                },
	                {
	                    label: 'Batch',
	                    data: [batchCorrect, batchIncorrect],
	                    backgroundColor: [
	                        '#4BC0C0',
	                        generateIncorrectColor(hueBatch)
	                    ]
	                }
	            ]
	        },
	        options: {
	            responsive: true,
	            title: { display: true, text: 'Firmas Simple vs Batch' },
	            tooltips: {
	                callbacks: {
	                    label: function(t, d) {
	                        var ds = d.datasets[t.datasetIndex];
	                        return ds.label + ' - ' + d.labels[t.index] + ': ' + ds.data[t.index];
	                    }
	                }
	            }
	        }
	    });
	
	 // === Segundo doughnut: Totales Simple/Batch por App (Org) ===
	    var ctx2 = document.getElementById('doughnutChartTotales').getContext('2d');
	    if (doughnutChartTotals) doughnutChartTotals.destroy();
	    doughnutChartTotals = new Chart(ctx2, {
	        type: 'doughnut',
	        data: {
	            labels: fullLabels,
	            datasets: [
	                { label: 'Simple', data: valsSimple, backgroundColor: segmentColors },
	                { label: 'Batch',  data: valsBatch,  backgroundColor: segmentColors }
	            ]
	        },
	        options: {
	            responsive: true,
	            title: {
	                display: true,
	                text: 'Totales Simple vs Batch por Aplicación y Organización'
	            },
	            plugins: {
	                legend: {
	                    labels: {
	                        generateLabels: function(chart) {
	                            var bg = chart.data.datasets[0].backgroundColor;
	                            var nameIndexMap = {};
	                            chart.data.labels.forEach(function(full, i) {
	                                var name = full.split(' (')[0];
	                                if (nameIndexMap[name] === undefined) {
	                                    nameIndexMap[name] = i;
	                                }
	                            });
	                            return Object.keys(nameIndexMap).map(function(name) {
	                                var i = nameIndexMap[name];
	                                return {
	                                    text: name,
	                                    fillStyle: bg[i],
	                                    hidden: false,
	                                    index: i
	                                };
	                            });
	                        }
	                    },
	                    onClick: function(evt, legendItem, legend) {
	                        var chart = legend.chart;
	                        var clickedName = legendItem.text;
	                        chart.data.labels.forEach(function(full, i) {
	                            if (full.split(' (')[0] === clickedName) {
	                                [0, 1].forEach(function(dsIndex) {
	                                    var meta = chart.getDatasetMeta(dsIndex);
	                                    meta.data[i].hidden = !meta.data[i].hidden;
	                                });
	                            }
	                        });
	                        chart.update();
	                    }
	                }
	            },
	            tooltips: {
	                callbacks: {
	                    label: function(tooltipItem, data) {
	                        var lbl = data.labels[tooltipItem.index];
	                        var val = data.datasets[tooltipItem.datasetIndex].data[tooltipItem.index];
	                        return lbl + ': ' + val;
	                    }
	                }
	            }
	        }
	    });
	}

    // Tamaño en bytes
	function drawDoughnutSizeChart(data) {
	    // 1) ordenar por name y luego por tamaño para agrupar segmentos
	    var sorted = data.slice().sort(function(a, b) {
	        var cmp = a.name.localeCompare(b.name);
	        return cmp !== 0 ? cmp : (a.sizeBytes - b.sizeBytes);
	    });
	
	    // 2) construir etiquetas completas y valores
	    var fullLabels = sorted.map(function(item) {
	        return item.name + ' (' + item.organization + ')';
	    });
	    var values = sorted.map(function(item) {
	        return item.sizeBytes || 0;
	    });
	
	    // 3) generar color único por name
	    var uniqueNames = Array.from(new Set(sorted.map(function(item) {
	        return item.name;
	    })));
	    var colorMap = {};
	    uniqueNames.forEach(function(name, i) {
	        colorMap[name] = generateCorrectColor(generateBaseHue(i, uniqueNames.length));
	    });
	    // asignar color a cada segmento
	    var colors = sorted.map(function(item) {
	        return colorMap[item.name];
	    });
	
	    // 4) dibujar gráfico
	    var ctx = document.getElementById('doughnutChartTotales').getContext('2d');
	    if (doughnutChartCorrect) doughnutChartCorrect.destroy();
	    doughnutChartCorrect = new Chart(ctx, {
	        type: 'doughnut',
	        data: {
	            labels: fullLabels,
	            datasets: [{ data: values, backgroundColor: colors }]
	        },
	        options: {
	            responsive: true,
	            title: { display: true, text: 'Distribución por Tamaño (Bytes)' },
	            legend: {
	                labels: {
	                    generateLabels: function(chart) {
	                        var bg = chart.data.datasets[0].backgroundColor;
	                        var seen = {};
	                        return chart.data.labels.map(function(fullLabel, idx) {
	                            var name = fullLabel.split(' (')[0];
	                            if (seen[name]) return null;
	                            seen[name] = true;
	                            return {
	                                text: name,
	                                fillStyle: bg[idx],
	                                hidden: false,
	                                index: idx
	                            };
	                        }).filter(Boolean);
	                    }
	                }
	            },
	            tooltips: {
	                callbacks: {
	                    label: function(tooltipItem, data) {
	                        var label = data.labels[tooltipItem.index];
	                        var value = data.datasets[0].data[tooltipItem.index];
	                        return label + ': ' + value;
	                    }
	                }
	            }
	        }
	    });
	}


    // Totales agrupados por organización

	        estadisticas[n][o].correctas   += item.corrects   || 0;
	        estadisticas[n][o].incorrectas += item.incorrects || 0;
	    });
	
	    // 3) crear datasets: para cada nombre, primero todos los segmentos de correctas y luego los de incorrectas
	    var datasets = [], stackId = 'stack';

    // Bar: Simple vs Batch por App (Org)
    function drawBarOperationChart(datos) {
        // 1) lista única de nombres (eje X)
        const nombres = Array.from(new Set(datos.map(item => item.name)));

        // 2) categorías "Nombre - Simple" y "Nombre - Batch"
        const categorias = [];
        nombres.forEach(nombre => {
            categorias.push(`${nombre} - Simple`);
            categorias.push(`${nombre} - Batch`);
        });

        // 3) agrupar correctas/incorrectas por nombre y organización
        const estadisticasSimple = {};
        const estadisticasBatch  = {};
        nombres.forEach(nombre => {
            estadisticasSimple[nombre] = {};
            estadisticasBatch[nombre]  = {};
        });
        datos.forEach(item => {
            const n = item.name, o = item.organization;
            if (!estadisticasSimple[n][o]) estadisticasSimple[n][o] = { correctas: 0, incorrectas: 0 };
            if (!estadisticasBatch[n][o])  estadisticasBatch[n][o]  = { correctas: 0, incorrectas: 0 };

            estadisticasSimple[n][o].correctas   += item.correctSimpleSignatures   || 0;
            estadisticasSimple[n][o].incorrectas += item.incorrectSimpleSignatures || 0;
            estadisticasBatch[n][o].correctas    += item.correctBatchSignatures    || 0;
            estadisticasBatch[n][o].incorrectas  += item.incorrectBatchSignatures  || 0;
        });

        // 4) crear datasets apilados: primero todos los Correctas, luego todos los Incorrectas
        const datasets = [];
        const idPila   = 'pila';

        nombres.forEach((nombre, idx) => {
            const orgs          = Object.keys(estadisticasSimple[nombre]);
            const matiz         = generateBaseHue(idx, nombres.length);
            const colorCorr     = generateCorrectColor(matiz);
            const colorIncorr   = generateIncorrectColor(matiz);
            const posSimple     = idx * 2;
            const posBatch      = idx * 2 + 1;

            // 4.1) primero los datasets de Correctas
            orgs.forEach(org => {
                const sS = estadisticasSimple[nombre][org];
                const sB = estadisticasBatch[nombre][org];
                const datosC = categorias.map((_, i) => {
                    if (i === posSimple) return sS.correctas;
                    if (i === posBatch)  return sB.correctas;
                    return 0;
                });
                datasets.push({
                    label: `${nombre} (${org}) – Correctas`,
                    data: datosC,
                    backgroundColor: colorCorr,
                    stack: idPila
                });
            });

            // 4.2) luego los datasets de Incorrectas
            orgs.forEach(org => {
                const sS = estadisticasSimple[nombre][org];
                const sB = estadisticasBatch[nombre][org];
                const datosI = categorias.map((_, i) => {
                    if (i === posSimple) return sS.incorrectas;
                    if (i === posBatch)  return sB.incorrectas;
                    return 0;
                });
                datasets.push({
                    label: `${nombre} (${org}) – Incorrectas`,
                    data: datosI,
                    backgroundColor: colorIncorr,
                    stack: idPila
                });
            });
        });

        // 5) dibujar gráfico con Chart.js v3+
        const ctx = document.getElementById('barChart').getContext('2d');
        if (barChart) barChart.destroy();
        barChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: categorias,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true }
                },
                plugins: {
                    legend: {
                        labels: {
                            // una etiqueta de leyenda por nombre
                            generateLabels(chart) {
                                return nombres.map(nombre => {
                                    const idxDs = chart.data.datasets.findIndex(ds =>
                                        ds.label.split(' (')[0] === nombre
                                    );
                                    return {
                                        text: nombre,
                                        fillStyle: chart.data.datasets[idxDs].backgroundColor,
                                        hidden: false,
                                        datasetIndex: idxDs
                                    };
                                });
                            }
                        },
                        onClick(evt, legendItem, legend) {
                            const chart = legend.chart;
                            const nombre = legendItem.text;
                            chart.data.datasets.forEach(ds => {
                                if (ds.label.split(' (')[0] === nombre) {
                                    ds.hidden = !ds.hidden;
                                }
                            });
                            chart.update();
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(ctx) {
                                return `${ctx.dataset.label}: ${ctx.dataset.data[ctx.dataIndex]}`;
                            }
                        }
                    }
                }
            }
        });

        // forzar ajuste al contenedor
        setTimeout(() => window.dispatchEvent(new Event('resize')), 0);
    }

 	// Evolución: Correctas vs Incorrectas apilado por aplicación
    function drawTimeEvolutionCorrectVsIncorrect(dataByMonth) {
	    var months = Object.keys(dataByMonth).sort(function(a, b) {
	        var pa = a.split('/'), pb = b.split('/');
	        return (parseInt(pa[1]) - parseInt(pb[1])) || (parseInt(pa[0]) - parseInt(pb[0]));
	    });
	
	    // recolectar nombres únicos
	    var apps = [];
	    months.forEach(function(m) {
	        dataByMonth[m].forEach(function(e) {
	            if (apps.indexOf(e.name) < 0) apps.push(e.name);
	        });
	    });
	
	    // inicializar arrays
	    var stats = {};
	    apps.forEach(function(name) {
	        stats[name] = {
	            corrects: new Array(months.length).fill(0),
	            incorrects: new Array(months.length).fill(0)
	        };
	    });
	
	    // rellenar datos
	    months.forEach(function(month, i) {
	        dataByMonth[month].forEach(function(e) {
	            stats[e.name].corrects[i]   = e.corrects   || 0;
	            stats[e.name].incorrects[i] = e.incorrects || 0;
	        });
	    });
	
	    // construir datasets filtrando valores cero y usando null para que no ocupen espacio
	    var datasets = [];
	    apps.forEach(function(name, idx) {
	        var hue    = generateBaseHue(idx, apps.length);
	        var cColor = generateCorrectColor(hue);
	        var iColor = generateIncorrectColor(hue);
	        var corrArr = stats[name].corrects;
	        var incArr  = stats[name].incorrects;
	
	        // sustituir 0 por null
	        var corrData = corrArr.map(function(v){ return v > 0 ? v : null; });
	        var incData  = incArr .map(function(v){ return v > 0 ? v : null; });

    function groupTopEntitiesFromSignatureSources(data, maxEntities) {
        const totalsByName = {};

        data.forEach(item => {
            const name = item.name || 'Desconocido';
            const corrects = (item.correctSimpleSignatures || 0) + (item.correctBatchSignatures || 0);
            const incorrects = (item.incorrectSimpleSignatures || 0) + (item.incorrectBatchSignatures || 0);

            if (!totalsByName[name]) {
                totalsByName[name] = 0;
            }

            totalsByName[name] += corrects + incorrects;
        });

        const topNames = Object.entries(totalsByName)
            .sort((a, b) => b[1] - a[1])
            .slice(0, maxEntities)
            .map(([name]) => name);

        const result = [];
        const others = {
            name: 'Otros',
            corrects: 0,
            incorrects: 0,
            total: 0,
            correctSimpleSignatures: 0,
            incorrectSimpleSignatures: 0,
            correctBatchSignatures: 0,
            incorrectBatchSignatures: 0,
            totalSimple: 0,
            totalBatch: 0
        };

        data.forEach(item => {
            const name = item.name || 'Desconocido';

            const correctSimple = item.correctSimpleSignatures || 0;
            const incorrectSimple = item.incorrectSimpleSignatures || 0;
            const correctBatch = item.correctBatchSignatures || 0;
            const incorrectBatch = item.incorrectBatchSignatures || 0;

            const totalSimple = item.totalSimple || 0;
            const totalBatch = item.totalBatch || 0;

            const corrects = correctSimple + correctBatch;
            const incorrects = incorrectSimple + incorrectBatch;
            const total = totalSimple + totalBatch;

            if (topNames.includes(name)) {
                result.push({
                    ...item,
                    corrects,
                    incorrects,
                    total
                });
            } else {
                others.corrects += corrects;
                others.incorrects += incorrects;
                others.total += total;

                others.correctSimpleSignatures += correctSimple;
                others.incorrectSimpleSignatures += incorrectSimple;
                others.correctBatchSignatures += correctBatch;
                others.incorrectBatchSignatures += incorrectBatch;
                others.totalSimple += totalSimple;
                others.totalBatch += totalBatch;
            }
        });

        // Separar others del array y ordenar solo el resto
        const orderedTop = result.sort((a, b) => (b.totalSimple + b.totalBatch) - (a.totalSimple + a.totalBatch));

        if (others.corrects > 0 || others.incorrects > 0 || others.total > 0) {
            orderedTop.push(others);
        }

        return orderedTop;
    }
