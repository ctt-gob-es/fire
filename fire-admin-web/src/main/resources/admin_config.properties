##########################################################
#  FICHERO DE CONFIGURACION DEL MODULO DE ADMINISTRACION #
##########################################################

# Este fichero sirve para configurar el modulo de administracion de
# FIRe ("fire-admin-web.war").

# Nombre del datasource
# En caso de no se reconozca el Datasource, a pesar de haber puesto el nombre
# correctamente, se puede probar con el siguiente prefijo, pues algunos
# servidores lo necesitan: java:comp/env/
datasource.jndi-name = java:comp/env/jdbc/firedb

# Dialecto Hibernate para la comunicacion con la base de datos
hibernate.dialect = org.hibernate.dialect.Oracle10gDialect

# Configura si se deben imprimir las consultas de base de datos en el log
hibernate.showSQL = true

# =============
# Configuracion de la cuenta de correo
# -------------

# Protocolo
mail.protocol=smtp
#Host del correo
mail.smtp.host=
# Indica si requiere conectarse por tls
mail.smtp.starttls.enable=true
# Puerto
mail.smtp.port=
# Indica el emisor del correo
mail.smtp.mail.sender=pruebascorreoricoh@gmail.com
# Usuario
mail.smtp.user=
# Contrase�a
mail.smtp.password=
# Indica si requiere autenticaci�n
mail.smtp.auth=true
# Indica el nombre del emisor del correo
mail.from.name=Administrador FIRe
# Indica el tiempo de caducidad del restablecimiento de contrasena (milisegundos)
mail.password.expiration=1800000


# =============================
# Configuracion de la Auditoria
# =============================
# Indica el tiempo por defecto en MINUTOS por el que se filtran inicialmente las peticiones de auditoria
# Si se deja vacia la propiedad, la tabla aparecera vacia al cargarla inicialmente
audit.time.default = 20

# =============================
# Configuracion de Afirma WS
# =============================
# Servicio DSS de verificacion de certificado
webservices.service.verifyCertificate=DSSAfirmaVerifyCertificate

# =============================
# Configuracion de certificado de contingencia
# =============================

# Numero de intentos fallidos para el acceso al modo de contingencia.
contingency.attemps = 3

# Intervalo de contingencia (segundos). Intervalo de tiempo dentro del cual se deben producir el numero fijado
# de intentos fallidos de acceso para que se active el mecanismo de contingencia.
contingency.interval=60

# Tiempo que estara habilitado el modo de contingencia despues de varios intentos de acceso fallidos
# (segundos)
contingency.duration=300

# Ruta absoluta con el almacen de confianza JKS para certificados emitidos por: FNMT Usuario, DNI electronico y FNMT Empleado Publico 
contingency.truststore.path=C:/Users/carlos.gamuci/Documents/FIRe/Repositorios-Github/fire/fire-admin-web/src/main/resources/almacenConfianzaUsuarios.jks

# Contrasena del almacen de confianza de contingencia
contingency.truststore.password=changeit

# Ruta absoluta a la carpeta donde se guardan los almacenes de confianza y el fichero de versiones
keystore.versions.path = 
